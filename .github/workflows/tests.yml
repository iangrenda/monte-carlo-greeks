name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==2.4.3" "scipy==1.16.2" "pandas==2.3.3" "matplotlib==3.10.7" pytest
          pip install -e .
      - name: Run tests
        run: python -m pytest -o addopts="" -q
